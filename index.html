<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crystal Saga - 1v1 Turn Battle</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 20%, #1a0b2e, #05020a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Start Menu */
    #start-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(42, 8, 69, 0.95), rgba(5, 2, 10, 0.98));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      text-align: center;
      padding: 20px;
    }
    .game-logo {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(45deg, #00ffff, #ff007f, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }
    .game-subtitle {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 35px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .play-btn {
      background: linear-gradient(45deg, #00f0ff, #7000ff, #ff007f);
      border: none;
      color: white;
      padding: 15px 45px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .play-btn:active { transform: scale(0.94); }

    /* PvP Battle Header */
    #game-ui {
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .pvp-header {
      display: flex;
      width: 360px;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }
    .player-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .p1-active {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .p2-active {
      border-color: #ff007f;
      background: rgba(255, 0, 127, 0.15);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }
    .player-name { font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .player-score { font-size: 22px; font-weight: 900; margin: 2px 0; }
    .player-info { font-size: 11px; color: #cbd5e1; }

    .timer-badge {
      background: rgba(0,0,0,0.6);
      border: 1px solid #ffd166;
      color: #ffd166;
      font-weight: bold;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    #game-container {
      position: relative;
    }

    .grid {
      width: 360px;
      height: 360px;
      display: grid;
      grid-template-columns: repeat(8, 45px);
      grid-template-rows: repeat(8, 45px);
      background: rgba(10, 2, 20, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .candy {
      width: 39px;
      height: 39px;
      margin: 3px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      box-shadow: inset -4px -4px 10px rgba(0,0,0,0.7), inset 4px 4px 10px rgba(255,255,255,0.85);
      transition: transform 0.1s ease;
    }
    .candy:active { transform: scale(1.18); }

    /* Gems */
    .c-ruby   { background: radial-gradient(circle at 30% 30%, #ff85a2, #d60036, #40000e); }
    .c-amber  { background: radial-gradient(circle at 30% 30%, #ffea85, #f3722c, #591600); border-radius: 10px; }
    .c-emerald{ background: radial-gradient(circle at 30% 30%, #7effb2, #059669, #011f17); border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
    .c-sapphire{ background: radial-gradient(circle at 30% 30%, #85dcff, #0284c7, #04192d); border-radius: 50% 20%; }
    .c-amethyst{ background: radial-gradient(circle at 30% 30%, #f4b6ff, #9333ea, #240342); border-radius: 20% 50%; }
    .c-diamond { background: radial-gradient(circle at 30% 30%, #ffffff, #94a3b8, #0f172a); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }

    /* Match Over Modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 2, 10, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      border-radius: 18px;
      text-align: center;
      padding: 20px;
    }
    .modal-box {
      background: #1e1b4b;
      border: 2px solid #00f0ff;
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0,240,255,0.4);
    }
    .btn-action {
      background: linear-gradient(45deg, #00f0ff, #7000ff);
      border: none;
      color: #fff;
      padding: 12px 26px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 15px;
      cursor: pointer;
    }
    .particles {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="start-screen">
    <div class="game-logo">⚔️ CRYSTAL 1v1</div>
    <div class="game-subtitle">Turn-Based PvP Battle</div>
    <button class="play-btn" onclick="startBattle()">START 1v1 MATCH</button>
  </div>

  <!-- Game UI -->
  <div id="game-ui">
    <div class="pvp-header">
      <div id="p1-card" class="player-card p1-active">
        <div class="player-name" style="color: #00f0ff;">Player 1 (You)</div>
        <div class="player-score" id="p1-score">0</div>
        <div class="player-info">Moves: <span id="p1-moves">15</span></div>
      </div>
      <div id="p2-card" class="player-card">
        <div class="player-name" style="color: #ff007f;">Player 2 (Opponent)</div>
        <div class="player-score" id="p2-score">0</div>
        <div class="player-info">Moves: <span id="p2-moves">15</span></div>
      </div>
    </div>

    <div class="timer-badge">
      ⏱️ Turn Time: <span id="timer-val">60</span>s
    </div>

    <div id="game-container">
      <div class="grid" id="grid">
        <canvas id="canvas" class="particles"></canvas>
      </div>

      <!-- Result Modal -->
      <div id="result-modal" class="modal-overlay">
        <div class="modal-box">
          <h2 id="winner-title" style="margin:0; color:#ffd166;">🏆 MATCH OVER</h2>
          <p id="winner-desc" style="font-size: 14px; color:#cbd5e1; margin-top: 8px;">Player 1 Won!</p>
          <button class="btn-action" onclick="resetBattle()">PLAY AGAIN 🔄</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
      if (!actx) actx = new AudioContext();
      if (actx.state === 'suspended') actx.resume();
    }

    function playGlassSound(type, pitch = 1) {
      if (!actx) return;
      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if (type === 'swap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, t);
        osc.frequency.exponentialRampToValueAtTime(2000, t + 0.04);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.04);
        osc.start(t); osc.stop(t + 0.04);
      } else if (type === 'chime') {
        osc.type = 'triangle';
        let freq = 1600 * pitch;
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.12);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type === 'shatter') {
        const bufferSize = actx.sampleRate * 0.22;
        const buf = actx.createBuffer(1, bufferSize, actx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (actx.sampleRate * 0.06));
        const noise = actx.createBufferSource();
        noise.buffer = buf;
        const filter = actx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4500, t);
        noise.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        noise.start(t); noise.stop(t + 0.22);
      }
    }

    // PvP Variables
    let activePlayer = 1; // 1 or 2
    let p1Score = 0, p2Score = 0;
    let p1Moves = 15, p2Moves = 15;
    let turnTime = 60;
    let turnInterval = null;
    let isGameOver = false;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360; canvas.height = 360;
    let parts = [];

    function emit(x, y, color) {
      for (let i = 0; i < 10; i++) {
        parts.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 4 + 2,
          c: color,
          a: 1
        });
      }
    }

    function renderParts() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(let i=parts.length-1; i>=0; i--) {
        let p = parts[i];
        p.x += p.vx; p.y += p.vy; p.a -= 0.045;
        ctx.globalAlpha = Math.max(0, p.a);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        if (p.a <= 0) parts.splice(i,1);
      }
      requestAnimationFrame(renderParts);
    }
    renderParts();

    const gems = ['c-ruby', 'c-amber', 'c-emerald', 'c-sapphire', 'c-amethyst', 'c-diamond'];
    const gemColors = {
      'c-ruby': '#ff85a2', 'c-amber': '#ffea85', 'c-emerald': '#7effb2',
      'c-sapphire': '#85dcff', 'c-amethyst': '#f4b6ff', 'c-diamond': '#ffffff'
    };

    const grid = document.getElementById('grid');
    const squares = [];
    const width = 8;
    let combo = 0;

    function startBattle() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-ui').style.display = 'flex';
      buildBoard();
      startTurnTimer();
    }

    function buildBoard() {
      grid.innerHTML = '<canvas id="canvas" class="particles"></canvas>';
      const c = document.getElementById('canvas');
      c.width = 360; c.height = 360;
      squares.length = 0;
      for (let i = 0; i < width * width; i++) {
        const sq = document.createElement('div');
        let r = gems[Math.floor(Math.random() * gems.length)];
        sq.setAttribute('id', i);
        sq.className = 'candy ' + r;
        grid.appendChild(sq);
        squares.push(sq);
      }
      bindTouch();
    }

    function startTurnTimer() {
      clearInterval(turnInterval);
      turnTime = 60;
      document.getElementById('timer-val').innerText = turnTime;

      turnInterval = setInterval(() => {
        turnTime--;
        document.getElementById('timer-val').innerText = turnTime;
        if (turnTime <= 0) {
          switchTurn(); // 60s timeout = turn switch
        }
      }, 1000);
    }

    function switchTurn() {
      if (activePlayer === 1) {
        p1Moves--;
        document.getElementById('p1-moves').innerText = Math.max(0, p1Moves);
        activePlayer = 2;
        document.getElementById('p1-card').classList.remove('p1-active');
        document.getElementById('p2-card').classList.add('p2-active');
      } else {
        p2Moves--;
        document.getElementById('p2-moves').innerText = Math.max(0, p2Moves);
        activePlayer = 1;
        document.getElementById('p2-card').classList.remove('p2-active');
        document.getElementById('p1-card').classList.add('p1-active');
      }

      if (p1Moves <= 0 && p2Moves <= 0) {
        endBattle();
      } else {
        startTurnTimer();
      }
    }

    function bindTouch() {
      let sx, sy, sId;
      squares.forEach(sq => {
        sq.addEventListener('touchstart', e => {
          if (isGameOver) return;
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          sId = parseInt(sq.id);
        }, { passive: false });

        sq.addEventListener('touchend', e => {
          if (isGameOver) return;
          let ex = e.changedTouches[0].clientX;
          let ey = e.changedTouches[0].clientY;
          let dx = ex - sx; let dy = ey - sy;
          if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;

          let tId;
          if (Math.abs(dx) > Math.abs(dy)) {
            tId = dx > 0 ? sId + 1 : sId - 1;
            if (dx > 0 && sId % width === width - 1) return;
            if (dx < 0 && sId % width === 0) return;
          } else {
            tId = dy > 0 ? sId + width : sId - width;
            if (dy > 0 && sId >= width * (width - 1)) return;
            if (dy < 0 && sId < width) return;
          }

          if (tId >= 0 && tId < 64) {
            playGlassSound('swap');
            swap(sId, tId);
            setTimeout(switchTurn, 400);
          }
        }, { passive: false });
      });
    }

    function getG(sq) {
      for (let g of gems) if (sq.classList.contains(g)) return g;
      return '';
    }
    function setG(sq, g) {
      sq.className = 'candy';
      if (g) sq.classList.add(g);
    }

    function swap(id1, id2) {
      let g1 = getG(squares[id1]);
      let g2 = getG(squares[id2]);
      setG(squares[id1], g2);
      setG(squares[id2], g1);
      combo = 0;
      checkMatches();
    }

    function checkMatches() {
      let matched = new Set();
      for (let i = 0; i < 62; i++) {
        let row = [i, i+1, i+2];
        let g = getG(squares[i]);
        if ([6,7,14,15,22,23,30,31,38,39,46,47,54,55].includes(i) || !g) continue;
        if (row.every(idx => getG(squares[idx]) === g)) row.forEach(idx => matched.add(idx));
      }
      for (let i = 0; i < 48; i++) {
        let col = [i, i+width, i+width*2];
        let g = getG(squares[i]);
        if (!g) continue;
        if (col.every(idx => getG(squares[idx]) === g)) col.forEach(idx => matched.add(idx));
      }

      if (matched.size > 0) {
        combo++;
        if (matched.size >= 4) {
          playGlassSound('shatter');
        } else {
          playGlassSound('chime', combo);
        }

        let pts = matched.size * 30 * combo;
        if (activePlayer === 1) {
          p1Score += pts;
          document.getElementById('p1-score').innerText = p1Score;
        } else {
          p2Score += pts;
          document.getElementById('p2-score').innerText = p2Score;
        }

        matched.forEach(idx => {
          let sq = squares[idx];
          let g = getG(sq);
          let rect = sq.getBoundingClientRect();
          let gr = grid.getBoundingClientRect();
          emit(rect.left - gr.left + 22, rect.top - gr.top + 22, gemColors[g] || '#fff');
          setG(sq, '');
        });
      }
    }

    function drop() {
      for (let i = 0; i < 56; i++) {
        if (getG(squares[i + width]) === '') {
          setG(squares[i + width], getG(squares[i]));
          setG(squares[i], '');
          if (i < 8 && getG(squares[i]) === '') {
            setG(squares[i], gems[Math.floor(Math.random() * gems.length)]);
          }
        }
      }
      for (let i = 0; i < 8; i++) {
        if (getG(squares[i]) === '') {
          setG(squares[i], gems[Math.floor(Math.random() * gems.length)]);
        }
      }
    }

    function endBattle() {
      isGameOver = true;
      clearInterval(turnInterval);
      const modal = document.getElementById('result-modal');
      const title = document.getElementById('winner-title');
      const desc = document.getElementById('winner-desc');

      if (p1Score > p2Score) {
        title.innerText = "🎉 PLAYER 1 WINS!";
        title.style.color = "#00f0ff";
        desc.innerText = `Player 1 scored ${p1Score} pts vs ${p2Score} pts`;
      } else if (p2Score > p1Score) {
        title.innerText = "🎉 PLAYER 2 WINS!";
        title.style.color = "#ff007f";
        desc.innerText = `Player 2 scored ${p2Score} pts vs ${p1Score} pts`;
      } else {
        title.innerText = "🤝 MATCH TIED!";
        title.style.color = "#ffd166";
        desc.innerText = `Both scored ${p1Score} pts!`;
      }
      modal.style.display = 'flex';
    }

    function resetBattle() {
      p1Score = 0; p2Score = 0;
      p1Moves = 15; p2Moves = 15;
      activePlayer = 1;
      isGameOver = false;
      document.getElementById('p1-score').innerText = 0;
      document.getElementById('p2-score').innerText = 0;
      document.getElementById('p1-moves').innerText = 15;
      document.getElementById('p2-moves').innerText = 15;
      document.getElementById('p1-card').classList.add('p1-active');
      document.getElementById('p2-card').classList.remove('p2-active');
      document.getElementById('result-modal').style.display = 'none';
      buildBoard();
      startTurnTimer();
    }

    setInterval(() => {
      drop();
      checkMatches();
    }, 150);
  </script>
</body>
</html>
