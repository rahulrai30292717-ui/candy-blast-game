name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Standalone APK
        run: |
          npm install -g cordova
          cordova create crystalapp com.crystalsaga.app "Crystal Saga"
          rm -rf crystalapp/www/*
          cp index.html crystalapp/www/
          cd crystalapp
          cordova platform add android
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CrystalSaga-APK
          path: crystalapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
